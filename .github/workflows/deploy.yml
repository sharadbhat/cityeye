name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Set up Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Generate city directory"
        run: npm run catalog

      - name: "Build website"
        run: npm run build

      - name: "Configure GitHub Pages"
        uses: actions/configure-pages@v5

      - name: "Upload website"
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
